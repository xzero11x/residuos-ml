name: bagua-circular
services:
  web:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    restart: unless-stopped
    ports:
      - "4322:4322"
    env_file: .env.docker
    volumes:
      - blog-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4322/api/posts').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:4322
    depends_on:
      web:
        condition: service_healthy
volumes:
  blog-data:
